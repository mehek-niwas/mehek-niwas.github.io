<head>
  <meta charset="UTF-8" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://mehek-niwas.github.io/blog" />
  <meta name="google-site-verification" content="sfQppSHf2YRlye86crIw0Kkf3EwVQxGGUvQ1bZif5K8" />

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/webp" href="assets/wink_star.webp">
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-HWFE3QDMRV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-HWFE3QDMRV');

<body>
  <!-- Main site navigation -->
  <nav>
    <a href="https://mehek-niwas.github.io" class="nav-button">home</a>
    <a href="https://mehek-niwas.github.io/blog" class="nav-button">blog</a>
    <a href="https://mehek-niwas.github.io/projects" class="nav-button">projects</a>
    <a href="https://mehek-niwas.github.io/side-quests" class="nav-button">side quests</a>
  </nav>

  <header>
    <div class="name-wrapper">
      <img src="assets/star.webp" class="star left" />
      <h1>blog </h1>
      <img src="assets/wink_star.webp" class="winkstar right" />
    </div>
  </header>

  <div class="llm-intro">
    <p class="tokenized-text">
      <span class="token-special">&lt;BOS&gt;</span>
      <span class="token">some</span>
      <span class="token">things</span>
      <span class="token">i'm</span>
      <span class="token">learning</span>
      <span class="token-special">&lt;EOS&gt;</span>
    </p>
    <p class="llm-intro-sub"></p>
  </div>

  <div class="blog-layout">

    <!-- Vertical topic nav (collapses into a dropdown-style button on mobile) -->
    <aside class="blog-topics" id="blog-topics">
      <button class="blog-topics-toggle" id="blog-topics-toggle"
              aria-expanded="false" aria-controls="blog-filters">
        <span id="blog-topics-current">all</span> <span class="blog-topics-caret">▾</span>
      </button>

      <div class="blog-filters" id="blog-filters" role="group" aria-label="Filter posts by topic">
        <button class="blog-filter is-active" data-filter="all">all</button>
        <button class="blog-filter" data-filter="interpretability">interpretability</button>
        <button class="blog-filter" data-filter="machine learning">machine learning</button>
        <button class="blog-filter" data-filter="agentic ai">agentic ai</button>
        <button class="blog-filter" data-filter="notes">notes</button>
      </div>
    </aside>

    <div class="blog-index">

      <!-- Posts (newest first). Copy an <article> block to add a post. -->
      <div class="blog-post-list" id="blog-post-list">

        <article class="blog-post" data-category="agentic ai">
          <p class="blog-post-date">Apr 21, 2026</p>
          <h2 class="blog-post-title">
            <a href="blog-aws-strands.html">When AIs Bluff: Building a Multi-Agent BS Card Game</a>
          </h2>
          <p class="blog-post-blurb">Making agents play BS with each other</p>
        </article>

      </div>

      <p class="blog-empty" id="blog-empty" hidden>coming soon...</p>

    </div>
  </div>

  <!-- Scroll to top button -->
  <button id="scrollToTop" class="scroll-to-top" aria-label="Scroll back to top">
    <img src="assets/pixel-art/sassy_frog.png" alt="Sassy Froggo" />
    <span>scroll back to the top</span>
  </button>

  <script src="script.js"></script>
  <script>
    // Topic filtering + mobile topic menu
    (function () {
      var topics = document.getElementById('blog-topics');
      var toggle = document.getElementById('blog-topics-toggle');
      var current = document.getElementById('blog-topics-current');
      var buttons = document.querySelectorAll('.blog-filter');
      var posts = document.querySelectorAll('.blog-post');
      var empty = document.getElementById('blog-empty');

      function setOpen(open) {
        topics.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      toggle.addEventListener('click', function () {
        setOpen(!topics.classList.contains('is-open'));
      });

      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          buttons.forEach(function (b) { b.classList.remove('is-active'); });
          btn.classList.add('is-active');
          current.textContent = btn.textContent;

          var filter = btn.dataset.filter;
          var visible = 0;
          posts.forEach(function (post) {
            var show = filter === 'all' || post.dataset.category === filter;
            post.hidden = !show;
            if (show) visible++;
          });
          empty.hidden = visible !== 0;

          // close the menu after picking a topic (only matters on mobile)
          setOpen(false);
        });
      });
    })();
  </script>
</body>
</html>
